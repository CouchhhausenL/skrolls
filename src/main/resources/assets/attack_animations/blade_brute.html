  {

    this[i]=Ascii.substring(PicLength*i,PicLength*(1+i));
    }
  }
A=new MakeArray();
function Play()
 {
  ms = Delay[No];
  if (go){
    document.f.ta.value = A[No];

  }
  if (No >= No_Pics)
    No = 0;
  setTimeout("Play()", ms);
 }

function page()
  {
  var n=0;
  var m=No_Pics;
  var a=A;
  document.write("<HTML>\n<HEAD><TITLE>Show Single Pictures</TITLE></HEAD>\n");

  for (n=0;n<m;n++)
    {
    document.write(a[n]);
    document.write("\n\n");
    }
  document.write("</PRE>\n</BODY>\n</HTML>");
  document.close();
