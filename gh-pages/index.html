<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Skrolls - Web Edition</title>

    <!-- CheerpJ WebAssembly Java Runtime Loader -->
    <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>

    <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        html, body {
          width: 100%;
          height: 100%;
          height: 100dvh;
          overflow: hidden;
          background-color: #101010;
          color: #f3cf83;
          font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
        }

        header {
          width: 100%;
          padding: 6px 16px;
          background-color: #1a1a1a;
          border-bottom: 1px solid #303030;
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 0.8rem;
          flex-shrink: 0;
          height: 34px;
          z-index: 10;
        }

        header h1 {
          font-size: 0.95rem;
          color: #a0ffa0;
          letter-spacing: 1px;
        }

        .header-actions {
          display: flex;
          align-items: center;
          gap: 14px;
        }

        header .info {
          color: #888888;
          font-size: 0.75rem;
        }

        #fullscreen-btn {
          background-color: #242424;
          color: #a0ffa0;
          border: 1px solid #404040;
          border-radius: 4px;
          padding: 2px 10px;
          font-size: 0.75rem;
          font-family: inherit;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          gap: 6px;
          outline: none;
          transition: background-color 0.2s, border-color 0.2s, color 0.2s, transform 0.1s;
        }

        #fullscreen-btn:hover {
          background-color: #303030;
          border-color: #a0ffa0;
          color: #ffffff;
        }

        #fullscreen-btn:active {
          transform: scale(0.96);
        }

        #game-container {
          flex: 1;
          width: 100%;
          height: calc(100dvh - 34px);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 0;
          padding: 8px 32px;
          overflow: hidden;
        }

        /* Fixed aspect container with extra horizontal padding so it looks like a classic vertical window */
        #cheerpj-display {
          background-color: #000000 !important;
          border: 1px solid #333640;
          border-radius: 6px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75), 0 0 1px rgba(255, 255, 255, 0.08);
          position: relative;
          overflow: hidden !important;
          padding: 8px 24px !important;
          box-sizing: border-box !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
        }

        /* Prevent CheerpJ window manager from creating a grey background or spilling out */
        #cheerpjDisplay,
        #cheerpj-display #cheerpjDisplay,
        #cheerpj-display .cjWindow {
          width: 100% !important;
          height: 100% !important;
          background: transparent !important;
          background-color: transparent !important;
          overflow: hidden !important;
          border: none !important;
          box-shadow: none !important;
        }

        #cheerpj-display canvas {
          width: 100% !important;
          height: 100% !important;
          max-width: 100% !important;
          max-height: 100% !important;
          display: block !important;
          object-fit: contain !important;
        }

        #status {
          margin-top: 6px;
          color: #707070;
          font-size: 0.75rem;
          flex-shrink: 0;
          height: 16px;
          line-height: 16px;
        }
    </style>
</head>
<body>
<header>
    <h1>SKROLLS</h1>
    <div class="header-actions">
        <span class="info">Powered by CheerpJ · Java 21 in WebAssembly</span>
        <button id="fullscreen-btn" type="button" title="Toggle Fullscreen">
            <span id="fullscreen-icon">⛶</span>
            <span id="fullscreen-text">Fullscreen</span>
        </button>
    </div>
</header>

<div id="game-container">
    <div id="cheerpj-display"></div>
    <div id="status">Initializing CheerpJ runtime...</div>
</div>

<script type="module">
    const status = document.getElementById("status");
    const displayElement = document.getElementById("cheerpj-display");
    const fullscreenBtn = document.getElementById("fullscreen-btn");
    const fullscreenIcon = document.getElementById("fullscreen-icon");
    const fullscreenText = document.getElementById("fullscreen-text");

    function setStatus(text) {
      if (status) status.textContent = text;
      console.log("[Status]", text);
    }

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
    }

    function updateFullscreenButton() {
      const active = isFullscreen();
      if (fullscreenIcon) {
        fullscreenIcon.textContent = active ? "✕" : "⛶";
      }
      if (fullscreenText) {
        fullscreenText.textContent = active ? "Exit Fullscreen" : "Fullscreen";
      }
      if (fullscreenBtn) {
        fullscreenBtn.title = active ? "Exit Fullscreen (F11 / Esc)" : "Enter Fullscreen (F11)";
      }
    }

    async function toggleFullscreen() {
      try {
        if (!isFullscreen()) {
          const target = document.documentElement;
          if (target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (target.webkitRequestFullscreen) {
            await target.webkitRequestFullscreen();
          } else if (target.mozRequestFullScreen) {
            await target.mozRequestFullScreen();
          } else if (target.msRequestFullscreen) {
            await target.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            await document.webkitExitFullscreen();
          } else if (document.mozCancelFullScreen) {
            await document.mozCancelFullScreen();
          } else if (document.msExitFullscreen) {
            await document.msExitFullscreen();
          }
        }
      } catch (err) {
        console.warn("Fullscreen toggle error:", err);
      } finally {
        updateFullscreenButton();
        fitDisplayToScreen();
      }
    }

    if (fullscreenBtn) {
      fullscreenBtn.addEventListener("click", toggleFullscreen);
    }

    document.addEventListener("fullscreenchange", () => {
      updateFullscreenButton();
      fitDisplayToScreen();
    });
    document.addEventListener("webkitfullscreenchange", () => {
      updateFullscreenButton();
      fitDisplayToScreen();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "F11") {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    async function init() {
      try {
        setStatus("Loading Java 21 WebAssembly runtime...");

        const audioCache = new Map();
        let currentMusic = null;

        await cheerpjInit({
          version: 21,
          execCallback: (cmdPath, argsArray) => {
            console.warn("Blocked native exec in CheerpJ:", cmdPath, argsArray);
            return 0;
          },
          javaProperties: [
            "cheerpj=true",
            "user.home=/files",
            "user.dir=/files",
            "java.io.tmpdir=/files",
            "org.jline.terminal.exec=false",
            "org.jline.terminal.jna=false",
            "org.jline.terminal.jansi=false",
            "sun.java2d.d3d=false",
            "sun.java2d.noddraw=true",
            "sun.java2d.opengl=false"
          ],
          natives: {
            async Java_main_java_util_AudioPlayer_playWebAudio(lib, path, byteData, volume, loop) {
              try {
                let audio = audioCache.get(path);
                if (!audio) {
                  const uint8 = new Uint8Array(byteData.buffer, byteData.byteOffset, byteData.byteLength);
                  const blob = new Blob([uint8], { type: "audio/wav" });
                  const url = URL.createObjectURL(blob);
                  audio = new Audio(url);
                  audioCache.set(path, audio);
                }
                audio.volume = Math.max(0, Math.min(1, volume));
                audio.loop = !!loop;
                audio.currentTime = 0;
                if (loop) {
                  if (currentMusic && currentMusic !== audio) {
                    currentMusic.pause();
                  }
                  currentMusic = audio;
                }
                await audio.play().catch(() => {});
              } catch (err) {
                console.warn("playWebAudio failed:", err);
              }
            },
            async Java_main_java_util_AudioPlayer_stopWebAudio(lib, path) {
              try {
                if (path) {
                  const a = audioCache.get(path);
                  if (a) {
                    a.pause();
                    a.currentTime = 0;
                  }
                } else if (currentMusic) {
                  currentMusic.pause();
                  currentMusic.currentTime = 0;
                }
              } catch (e) {}
            },
            async Java_main_java_util_AudioPlayer_setWebAudioVolume(lib, volume) {
              try {
                for (const a of audioCache.values()) {
                  a.volume = Math.max(0, Math.min(1, volume));
                }
              } catch (e) {}
            }
          }
        });

        // 80 columns x 50 rows character grid (each cell is 10px x 22px = 800x1100 px)
        setStatus("Initializing display area (800x1100)...");
        cheerpjCreateDisplay(800, 1100, displayElement);

        fitDisplayToScreen();

        setStatus("Locating application bundle...");
        const basePath = window.location.pathname.replace(/\/[^/]*$/, "");
        const jarPath = `/app${basePath}/skrolls.jar`.replace(/\/\//g, "/");

        setStatus("Launching Skrolls...");
        const exitCode = await cheerpjRunJar(jarPath, "--window");

        if (exitCode !== 0) {
          setStatus(`Game terminated with code ${exitCode}.`);
        } else {
          setStatus("Game terminated normally.");
        }
      } catch (err) {
        console.error("CheerpJ top-level error:", err);
        setStatus("Launch failed.");
      }
    }

    // Unlock / resume Web Audio API on first user interaction (browser autoplay policy)
    function unlockAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        // Resume any browser audio contexts if suspended
      }
      document.removeEventListener("pointerdown", unlockAudio);
      document.removeEventListener("keydown", unlockAudio);
    }
    document.addEventListener("pointerdown", unlockAudio, { passive: true });
    document.addEventListener("keydown", unlockAudio, { passive: true });

    function fitDisplayToScreen() {
      const display = document.getElementById("cheerpj-display");
      if (!display) return;

      const header = document.querySelector("header");
      const headerH = header ? header.offsetHeight : 34;
      const status = document.getElementById("status");
      const statusH = (status && status.offsetHeight) ? status.offsetHeight : 16;

      const inFs = isFullscreen();
      // Keep comfortable margins around the window
      const containerPadX = inFs ? 24 : 48;
      const containerPadY = inFs ? 12 : 24;

      const maxW = Math.max(200, window.innerWidth - containerPadX);
      const maxH = Math.max(200, window.innerHeight - headerH - statusH - containerPadY);

      // Extra horizontal padding (24px left + 24px right = 48px) and vertical (8px top + 8px bottom = 16px)
      // to make the window feel like a sleek, properly proportioned vertical rectangle
      const padDisplayX = 48;
      const padDisplayY = 16;

      const availCanvasW = Math.max(100, maxW - padDisplayX);
      const availCanvasH = Math.max(100, maxH - padDisplayY);

      const baseW = 800;
      const baseH = 1100;
      const aspect = baseW / baseH;

      let canvasW = availCanvasH * aspect;
      let canvasH = availCanvasH;

      if (canvasW > availCanvasW) {
        canvasW = availCanvasW;
        canvasH = availCanvasW / aspect;
      }

      canvasW = Math.floor(canvasW);
      canvasH = Math.floor(canvasH);

      const outerW = canvasW + padDisplayX;
      const outerH = canvasH + padDisplayY;

      display.style.setProperty("width", outerW + "px", "important");
      display.style.setProperty("height", outerH + "px", "important");

      const cheerpjDisplay = document.getElementById("cheerpjDisplay");
      if (cheerpjDisplay) {
        cheerpjDisplay.style.setProperty("width", "100%", "important");
        cheerpjDisplay.style.setProperty("height", "100%", "important");
        cheerpjDisplay.style.setProperty("background", "transparent", "important");
      }

      const cjWindows = display.querySelectorAll(".cjWindow");
      cjWindows.forEach(w => {
        w.style.setProperty("width", "100%", "important");
        w.style.setProperty("height", "100%", "important");
        w.style.setProperty("background", "transparent", "important");
      });

      const canvas = display.querySelector("canvas");
      if (canvas) {
        canvas.style.setProperty("width", "100%", "important");
        canvas.style.setProperty("height", "100%", "important");
      }
    }

    window.addEventListener("resize", fitDisplayToScreen);

    const observer = new MutationObserver(() => {
      fitDisplayToScreen();
    });
    observer.observe(displayElement, { childList: true, subtree: true });

    const resizeInterval = setInterval(fitDisplayToScreen, 200);
    setTimeout(() => clearInterval(resizeInterval), 15000);

    window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
