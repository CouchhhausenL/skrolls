<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Skrolls</title>

    <!-- CheerpJ WebAssembly Java Runtime Loader -->
    <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>

    <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        html, body {
          width: 100%;
          height: 100%;
          overflow: hidden;
          background-color: #000000;
          color: #f3cf83;
          font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
          display: flex;
          align-items: center;
          justify-content: center;
          user-select: none;
          -webkit-user-select: none;
        }

        #cheerpj-display {
          background-color: #000000 !important;
          border: none !important;
          box-shadow: none !important;
          position: relative;
          overflow: hidden !important;
          padding: 0 !important;
          margin: 0 !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
        }

        /* Prevent CheerpJ window manager from creating borders or gray background */
        #cheerpjDisplay,
        #cheerpj-display #cheerpjDisplay,
        #cheerpj-display .cjWindow {
          width: 100% !important;
          height: 100% !important;
          background: transparent !important;
          background-color: transparent !important;
          overflow: hidden !important;
          border: none !important;
          box-shadow: none !important;
        }

        #cheerpj-display canvas {
          width: 100% !important;
          height: 100% !important;
          max-width: 100% !important;
          max-height: 100% !important;
          display: block !important;
          object-fit: contain !important;
          outline: none !important;
        }

        /* Clean loading overlay that disappears once the game starts */
        #loading-overlay {
          position: fixed;
          inset: 0;
          background-color: #000000;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          opacity: 1;
          transition: opacity 0.5s ease-out;
          pointer-events: none;
        }

        #loading-overlay.fade-out {
          opacity: 0;
        }

        .loader-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
          text-align: center;
        }

        .spinner {
          width: 38px;
          height: 38px;
          border: 3px solid #222222;
          border-top-color: #a0ffa0;
          border-radius: 50%;
          animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
          to { transform: rotate(360deg); }
        }

        #status-text {
          color: #a0ffa0;
          font-size: 0.85rem;
          letter-spacing: 1.5px;
          text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="cheerpj-display"></div>

<div id="loading-overlay">
    <div class="loader-content">
        <div class="spinner"></div>
        <div id="status-text">Loading Skrolls...</div>
    </div>
</div>

<script type="module">
    const displayElement = document.getElementById("cheerpj-display");
    const statusText = document.getElementById("status-text");
    const loadingOverlay = document.getElementById("loading-overlay");

    function setStatus(text, isError = false) {
      if (statusText) statusText.textContent = text;
      if (isError) {
        const spinner = document.querySelector(".spinner");
        if (spinner) spinner.style.display = "none";
        if (statusText) statusText.style.color = "#ff6b6b";
      }
      console.log("[Status]", text);
    }

    let gameStarted = false;
    function hideLoader() {
      if (gameStarted) return;
      gameStarted = true;
      if (loadingOverlay) {
        loadingOverlay.classList.add("fade-out");
        setTimeout(() => {
          if (loadingOverlay.parentNode) {
            loadingOverlay.parentNode.removeChild(loadingOverlay);
          }
        }, 550);
      }
      focusCanvas();
    }

    function focusCanvas() {
      const canvas = displayElement ? displayElement.querySelector("canvas") : null;
      if (canvas) {
        canvas.tabIndex = 0;
        canvas.focus();
      }
    }

    // Keep game canvas focused and prevent itch.io iframe scrolling with arrow/space keys
    window.addEventListener("pointerdown", focusCanvas);
    window.addEventListener("focus", focusCanvas);
    window.addEventListener("keydown", (e) => {
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
      }
      if (e.key === "F11") {
        e.preventDefault();
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
    });

    // Unlock Web Audio on first user interaction (browser autoplay policy)
    function unlockAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        // Active contexts will resume upon interaction
      }
      document.removeEventListener("pointerdown", unlockAudio);
      document.removeEventListener("keydown", unlockAudio);
    }
    document.addEventListener("pointerdown", unlockAudio, { passive: true });
    document.addEventListener("keydown", unlockAudio, { passive: true });

    function fitDisplayToScreen() {
      if (!displayElement) return;

      const availW = window.innerWidth;
      const availH = window.innerHeight;
      const baseW = 800;
      const baseH = 1100;
      const aspect = baseW / baseH;

      let canvasW = availH * aspect;
      let canvasH = availH;

      if (canvasW > availW) {
        canvasW = availW;
        canvasH = availW / aspect;
      }

      canvasW = Math.floor(canvasW);
      canvasH = Math.floor(canvasH);

      displayElement.style.setProperty("width", canvasW + "px", "important");
      displayElement.style.setProperty("height", canvasH + "px", "important");

      const cheerpjDisplay = document.getElementById("cheerpjDisplay");
      if (cheerpjDisplay) {
        cheerpjDisplay.style.setProperty("width", "100%", "important");
        cheerpjDisplay.style.setProperty("height", "100%", "important");
        cheerpjDisplay.style.setProperty("background", "transparent", "important");
      }

      const cjWindows = displayElement.querySelectorAll(".cjWindow");
      cjWindows.forEach(w => {
        w.style.setProperty("width", "100%", "important");
        w.style.setProperty("height", "100%", "important");
        w.style.setProperty("background", "transparent", "important");
      });

      const canvas = displayElement.querySelector("canvas");
      if (canvas) {
        canvas.style.setProperty("width", "100%", "important");
        canvas.style.setProperty("height", "100%", "important");
      }
    }

    window.addEventListener("resize", fitDisplayToScreen);

    const observer = new MutationObserver(() => {
      fitDisplayToScreen();
      const canvas = displayElement.querySelector("canvas");
      if (canvas) {
        setTimeout(hideLoader, 300);
      }
    });
    observer.observe(displayElement, { childList: true, subtree: true });

    async function init() {
      try {
        setStatus("Loading runtime...");

        const audioCache = new Map();
        let currentMusic = null;

        await cheerpjInit({
          version: 21,
          execCallback: (cmdPath, argsArray) => {
            console.warn("Blocked native exec in CheerpJ:", cmdPath, argsArray);
            return 0;
          },
          javaProperties: [
            "cheerpj=true",
            "user.home=/files",
            "user.dir=/files",
            "java.io.tmpdir=/files",
            "org.jline.terminal.exec=false",
            "org.jline.terminal.jna=false",
            "org.jline.terminal.jansi=false",
            "sun.java2d.d3d=false",
            "sun.java2d.noddraw=true",
            "sun.java2d.opengl=false"
          ],
          natives: {
            async Java_main_java_util_AudioPlayer_playWebAudio(lib, path, byteData, volume, loop) {
              try {
                let audio = audioCache.get(path);
                if (!audio) {
                  const uint8 = new Uint8Array(byteData.buffer, byteData.byteOffset, byteData.byteLength);
                  const blob = new Blob([uint8], { type: "audio/wav" });
                  const url = URL.createObjectURL(blob);
                  audio = new Audio(url);
                  audioCache.set(path, audio);
                }
                audio.volume = Math.max(0, Math.min(1, volume));
                audio.loop = !!loop;
                audio.currentTime = 0;
                if (loop) {
                  if (currentMusic && currentMusic !== audio) {
                    currentMusic.pause();
                  }
                  currentMusic = audio;
                }
                await audio.play().catch(() => {});
              } catch (err) {
                console.warn("playWebAudio failed:", err);
              }
            },
            async Java_main_java_util_AudioPlayer_stopWebAudio(lib, path) {
              try {
                if (path) {
                  const a = audioCache.get(path);
                  if (a) {
                    a.pause();
                    a.currentTime = 0;
                  }
                } else if (currentMusic) {
                  currentMusic.pause();
                  currentMusic.currentTime = 0;
                }
              } catch (e) {}
            },
            async Java_main_java_util_AudioPlayer_setWebAudioVolume(lib, volume) {
              try {
                for (const a of audioCache.values()) {
                  a.volume = Math.max(0, Math.min(1, volume));
                }
              } catch (e) {}
            }
          }
        });

        // 80 columns x 50 rows character grid (800x1100 px)
        cheerpjCreateDisplay(800, 1100, displayElement);
        fitDisplayToScreen();

        setStatus("Launching Skrolls...");
        const basePath = window.location.pathname.replace(/\/[^/]*$/, "");
        const jarPath = `/app${basePath}/skrolls.jar`.replace(/\/\//g, "/");

        // Hide overlay once display is created and ready
        setTimeout(hideLoader, 600);

        const exitCode = await cheerpjRunJar(jarPath, "--window");
        if (exitCode !== 0) {
          console.warn(`Game terminated with exit code ${exitCode}`);
        }
      } catch (err) {
        console.error("CheerpJ launch error:", err);
        setStatus("Launch failed", true);
      }
    }

    const resizeInterval = setInterval(fitDisplayToScreen, 200);
    setTimeout(() => clearInterval(resizeInterval), 10000);

    window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
