<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Skrolls Editor</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-panel: #1e1e24;
            --bg-element: #2b2b36;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .logo { font-weight: bold; font-size: 1.1rem; color: var(--accent); white-space: nowrap; }
        .header-center { display: flex; align-items: center; gap: 10px; }
        .sprite-name-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-element);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .sprite-name-box label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }
        .sprite-name-box input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.95rem;
            width: 160px;
            outline: none;
        }
        .sprite-name-box input:focus {
            border-bottom: 1px solid var(--accent);
        }
        .file-controls, .export-controls { display: flex; gap: 10px; align-items: center; }

        /* Main Workspace */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Tools Sidebar */
        .sidebar {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }
        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tool-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }
        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .tool-row { display: flex; gap: 8px; align-items: center; }

        /* Color Wheel Box */
        .color-picker-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: var(--bg-element);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .wheel-container {
            position: relative;
            width: 180px;
            height: 180px;
            cursor: crosshair;
        }
        #color-wheel {
            border-radius: 50%;
            display: block;
        }
        #wheel-cursor {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(0,0,0,0.8);
            pointer-events: none;
            transform: translate(-50%, -50%);
            top: 50%;
            left: 50%;
        }
        .slider-row {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-row label {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
        input[type="range"].color-slider {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
            background: linear-gradient(to right, #000, #ff0000, #fff);
        }
        input[type="range"].color-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--border);
            cursor: pointer;
        }

        .color-preview-box {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 8px;
        }
        .preview-swatch {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        /* Swatches & Palette */
        .swatches {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 5px;
            max-height: 120px;
            overflow-y: auto;
            padding: 2px;
        }
        .swatch-wrapper {
            position: relative;
            display: inline-block;
        }
        .swatch {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .swatch:hover { transform: scale(1.15); }

        .swatch-wrapper.editing .swatch {
            border: 1px solid #ef4444;
            box-shadow: 0 0 4px rgba(239, 68, 68, 0.6);
        }
        .swatch-del-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 13px;
            height: 13px;
            background: #ef4444;
            color: #ffffff;
            font-size: 10px;
            line-height: 12px;
            text-align: center;
            border-radius: 50%;
            pointer-events: none;
            font-weight: bold;
        }

        /* Center Canvas Viewport */
        .viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #08080a;
            padding: 20px;
            overflow: auto;
            position: relative;
        }

        /* ASCII Grid Element */
        #ascii-grid {
            display: grid;
            user-select: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            background-color: #000000;
        }
        .cell {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-align: center;
            line-height: 1;
            cursor: crosshair;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Text Grid Hilfslinien */
        #ascii-grid.show-grid .cell {
            outline: 1px solid rgba(255, 255, 255, 0.15);
            outline-offset: -1px;
        }

        /* Bottom Timeline & Playback */
        .timeline {
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .timeline-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .playback-buttons { display: flex; gap: 8px; }
        .frame-slider-container { display: flex; align-items: center; gap: 15px; flex: 1; margin: 0 20px; }
        .frame-slider-container input[type="range"] { flex: 1; }

        /* UI Elements Styling */
        button, .btn-label {
            background-color: var(--bg-element);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        button:hover, .btn-label:hover { background-color: var(--border); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.primary { background-color: var(--accent); border-color: var(--accent); }
        button.primary:hover { background-color: var(--accent-hover); }
        button.active { border-color: var(--accent); background-color: rgba(99, 102, 241, 0.2); }

        input[type="number"], input[type="text"] {
            background-color: var(--bg-element);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 100%;
        }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }
        input[type="file"] { display: none; }

        .shortcut-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: auto;
            background: rgba(255,255,255,0.05);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .shortcuts-box {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Universal Skrolls Editor</div>

        <div class="header-center">
            <div class="sprite-name-box">
                <label for="sprite-name-input">Sprite:</label>
                <input type="text" id="sprite-name-input" value="Sprite_01" placeholder="Sprite Name..." title="Name des Sprites/Projekts">
            </div>
        </div>

        <div class="file-controls">
            <label class="btn-label">
                📂 Dateien Öffnen (.ska / .jmov / .html)
                <input type="file" id="file-input" accept=".ska,.jmov,.jave,.html,.htm,.txt">
            </label>
        </div>
        <div class="export-controls">
            <button id="btn-export" class="primary">💾 Als .ska Speichern <span class="shortcut-hint">Strg+S</span></button>
        </div>
    </header>

    <div class="workspace">
        <aside class="sidebar">
            <div class="tool-group">
                <label>Verlauf (History)</label>
                <div class="tool-row">
                    <button id="btn-undo" title="Strg+Z" disabled>↩️ Undo</button>
                    <button id="btn-redo" title="Strg+Y" disabled>↪️ Redo</button>
                </div>
            </div>

            <div class="tool-group">
                <label>Werkzeug Modus</label>
                <div class="tool-grid">
                    <button id="tool-paint" class="active">🖌️ Paint <span class="shortcut-hint">B</span></button>
                    <button id="tool-erase">🧹 Erase <span class="shortcut-hint">E</span></button>
                    <button id="tool-picker">🧪 Pipette <span class="shortcut-hint">I</span></button>
                    <button id="tool-recolor-char">🎯 Char-Farbe <span class="shortcut-hint">R</span></button>
                </div>
            </div>

            <div class="tool-group">
                <label>Farbe Anwenden Auf</label>
                <div class="tool-row">
                    <button id="target-fg" class="active">FG <span class="shortcut-hint">F</span></button>
                    <button id="target-bg">BG <span class="shortcut-hint">G</span></button>
                    <button id="target-both">Beides <span class="shortcut-hint">T</span></button>
                </div>
            </div>

            <div class="tool-group">
                <label>Farbrad & Helligkeit</label>
                <div class="color-picker-box">
                    <div class="wheel-container" id="wheel-container">
                        <canvas id="color-wheel" width="180" height="180"></canvas>
                        <div id="wheel-cursor"></div>
                    </div>
                    <div class="slider-row">
                        <label><span>Helligkeit</span><span id="lightness-val">50%</span></label>
                        <input type="range" id="lightness-slider" class="color-slider" min="0" max="100" value="50">
                    </div>
                    <div class="color-preview-box">
                        <div class="preview-swatch" id="color-preview"></div>
                        <input type="text" id="hex-input" value="#FFFFFF" maxlength="7">
                        <button id="btn-add-palette" title="Farbe zur Palette hinzufügen" style="padding: 6px 8px; font-size: 0.9rem;">⭐</button>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top:5px;">
                    <label style="margin:0;">Gespeicherte Palette</label>
                    <button id="btn-edit-palette" style="padding: 2px 6px; font-size: 0.7rem;">✏️ Palette bearbeiten</button>
                </div>
                <div class="swatches" id="preset-swatches"></div>
            </div>

            <div class="tool-group">
                <label>Canvas Einstellungen</label>
                <div class="tool-row">
                    <span style="font-size:0.8rem; width:80px;">Breite/Höhe:</span>
                    <input type="number" id="canvas-w" value="80" min="1" max="200" disabled>
                    <input type="number" id="canvas-h" value="30" min="1" max="200" disabled>
                </div>
                <div class="tool-row" style="margin-top: 5px;">
                    <span style="font-size:0.8rem; width:80px;">Default BG:</span>
                    <input type="color" id="canvas-bg-picker" value="#000000">
                </div>
                <!-- Raster-Schalter -->
                <div class="tool-row" style="margin-top: 5px;">
                    <button id="btn-toggle-grid" class="active" style="width: 100%;">🏁 Text-Grid (Raster) an/aus <span class="shortcut-hint">#</span></button>
                </div>
            </div>

            <div class="tool-group">
                <label>Aktionen (Einfärben & Resets)</label>
                <button id="btn-fill-fg-chars">🔤 Nur Text-Zeichen VG färben</button>
                <button id="btn-fill-fg-chars-all">🌐 Alle Frames: Text-VG färben</button>
                <button id="btn-fill-bg">🔲 Hintergrund Füllen (Frame)</button>
                <button id="btn-fill-fg">🎨 Gesamtes VG Füllen (Frame)</button>
                <button id="btn-clear-colors">🧹 Farben Zurücksetzen (Frame)</button>
            </div>

            <div class="tool-group">
                <label>Shortcuts Hilfe</label>
                <div class="shortcuts-box">
                    <b>Space:</b> Play / Pause<br>
                    <b>← / →:</b> Frame Zurück / Vor<br>
                    <b>Strg+Z / Strg+Y:</b> Undo / Redo<br>
                    <b>B / E:</b> Paint / Erase<br>
                    <b>I / R:</b> Pipette / Char-Farbe<br>
                    <b>F / G / T:</b> FG / BG / Beides<br>
                    <b>#:</b> Grid Linien ein/aus
                </div>
            </div>
        </aside>

        <main class="viewport">
            <div id="ascii-grid" class="show-grid"></div>
        </main>
    </div>

    <footer class="timeline">
        <div class="timeline-controls">
            <div class="playback-buttons">
                <button id="btn-play">▶ Play <span class="shortcut-hint">Space</span></button>
                <button id="btn-prev">⏮️ <span class="shortcut-hint">←</span></button>
                <button id="btn-next">⏭️ <span class="shortcut-hint">→</span></button>
            </div>

            <div class="frame-slider-container">
                <span id="frame-counter" style="font-size:0.85rem; font-family:monospace;">Frame: 1 / 1</span>
                <input type="range" id="frame-slider" min="0" max="0" value="0">
            </div>

            <div class="tool-row" style="width: auto;">
                <span style="font-size:0.85rem;">FPS:</span>
                <input type="number" id="fps-input" value="15" min="1" max="60" style="width: 60px;">
            </div>
        </div>
    </footer>

    <script>
        let project = {
            name: "Sprite_01",
            canvas: { width: 80, height: 30, backgroundColor: "#000000", fps: 15 },
            frames: []
        };

        let state = {
            currentFrame: 0,
            isPlaying: false,
            playInterval: null,
            activeTool: 'paint',
            colorTarget: 'fg',
            fgColor: '#ffffff',
            bgColor: '#000000',
            isMouseDown: false,
            cellWidth: 10,
            cellHeight: 18,
            hue: 0,
            sat: 0,
            light: 100,
            isWheelDragging: false,
            colorHistory: [],
            isEditingPalette: false,
            showGrid: true
        };

        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 50;

        const DEFAULT_PRESET_COLORS = ['#FFFFFF', '#000000', '#FF0000', '#00FF00', '#FFFF00', '#FF00FF', '#00FFFF', '#FF8800', '#888888'];

        const gridEl = document.getElementById('ascii-grid');
        const fileInput = document.getElementById('file-input');
        const spriteNameInput = document.getElementById('sprite-name-input');
        const btnPlay = document.getElementById('btn-play');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnUndo = document.getElementById('btn-undo');
        const btnRedo = document.getElementById('btn-redo');
        const frameSlider = document.getElementById('frame-slider');
        const frameCounter = document.getElementById('frame-counter');
        const fpsInput = document.getElementById('fps-input');
        const canvasBgPicker = document.getElementById('canvas-bg-picker');
        const canvasW = document.getElementById('canvas-w');
        const canvasH = document.getElementById('canvas-h');
        const btnToggleGrid = document.getElementById('btn-toggle-grid');

        const wheelCanvas = document.getElementById('color-wheel');
        const wheelCtx = wheelCanvas.getContext('2d');
        const wheelCursor = document.getElementById('wheel-cursor');
        const wheelContainer = document.getElementById('wheel-container');
        const lightnessSlider = document.getElementById('lightness-slider');
        const lightnessVal = document.getElementById('lightness-val');
        const colorPreview = document.getElementById('color-preview');
        const hexInput = document.getElementById('hex-input');

        function init() {
            loadColorHistory();
            createEmptyProject(80, 30, 1);
            setupEventListeners();
            setupShortcuts();
            setupColorWheel();
            renderGrid();
            updateUI();
            setColorFromHex('#ffffff');
        }

        function loadColorHistory() {
            try {
                const saved = localStorage.getItem('skrolls_color_history');
                if (saved) {
                    state.colorHistory = JSON.parse(saved);
                } else {
                    state.colorHistory = [...DEFAULT_PRESET_COLORS];
                }
            } catch (e) {
                state.colorHistory = [...DEFAULT_PRESET_COLORS];
            }
            renderHistorySwatches();
        }

        function saveColorHistory() {
            try {
                localStorage.setItem('skrolls_color_history', JSON.stringify(state.colorHistory));
            } catch (e) {}
        }

        function addColorToPalette(hex) {
            if (!hex || !/^#[0-9A-F]{6}$/i.test(hex)) return;
            hex = hex.toUpperCase();
            
            state.colorHistory = state.colorHistory.filter(c => c.toUpperCase() !== hex);
            state.colorHistory.unshift(hex);
            
            if (state.colorHistory.length > 50) state.colorHistory.pop();
            
            saveColorHistory();
            renderHistorySwatches();
        }

        function removeColorFromHistory(hex) {
            hex = hex.toUpperCase();
            state.colorHistory = state.colorHistory.filter(c => c.toUpperCase() !== hex);
            saveColorHistory();
            renderHistorySwatches();
        }

        function renderHistorySwatches() {
            const container = document.getElementById('preset-swatches');
            container.innerHTML = '';
            
            state.colorHistory.forEach(color => {
                let wrapper = document.createElement('div');
                wrapper.className = 'swatch-wrapper';
                if (state.isEditingPalette) wrapper.classList.add('editing');

                let s = document.createElement('div');
                s.className = 'swatch';
                s.style.backgroundColor = color;
                s.title = state.isEditingPalette ? `${color} (Klicken zum Löschen)` : `${color} (Klicken zum Auswählen)`;
                
                s.onclick = () => {
                    if (state.isEditingPalette) {
                        removeColorFromHistory(color);
                    } else {
                        setColorFromHex(color);
                    }
                };

                if (state.isEditingPalette) {
                    let badge = document.createElement('div');
                    badge.className = 'swatch-del-badge';
                    badge.textContent = '×';
                    wrapper.appendChild(badge);
                }

                wrapper.appendChild(s);
                container.appendChild(wrapper);
            });
        }

        function createEmptyProject(w, h, frameCount) {
            project.name = spriteNameInput.value.trim() || "Sprite_01";
            project.canvas.width = w;
            project.canvas.height = h;
            project.canvas.backgroundColor = "#000000";
            project.canvas.fps = 15;
            project.frames = [];

            for (let f = 0; f < frameCount; f++) {
                let matrix = [];
                for (let y = 0; y < h; y++) {
                    let row = [];
                    for (let x = 0; x < w; x++) {
                        row.push({ char: ' ', fg: null, bg: null });
                    }
                    matrix.push(row);
                }
                project.frames.push(matrix);
            }
            state.currentFrame = 0;
            clearHistory();
        }

        function setupColorWheel() {
            drawWheel();

            wheelContainer.addEventListener('mousedown', (e) => {
                state.isWheelDragging = true;
                handleWheelPick(e);
            });

            window.addEventListener('mousemove', (e) => {
                if (state.isWheelDragging) handleWheelPick(e);
            });

            window.addEventListener('mouseup', () => {
                if (state.isWheelDragging) {
                    state.isWheelDragging = false;
                }
            });

            lightnessSlider.addEventListener('input', (e) => {
                state.light = parseInt(e.target.value);
                lightnessVal.textContent = state.light + '%';
                updateColorFromHSL();
            });

            hexInput.addEventListener('change', (e) => {
                let hex = e.target.value.trim();
                if (!hex.startsWith('#')) hex = '#' + hex;
                if (/^#[0-9A-F]{6}$/i.test(hex)) {
                    setColorFromHex(hex);
                }
            });

            document.getElementById('btn-add-palette').onclick = () => {
                let currentHex = (state.colorTarget === 'bg') ? state.bgColor : state.fgColor;
                addColorToPalette(currentHex);
            };
        }

        function drawWheel() {
            const w = wheelCanvas.width;
            const h = wheelCanvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const radius = w / 2 - 2;

            const imgData = wheelCtx.createImageData(w, h);
            const data = imgData.data;

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const dx = x - cx;
                    const dy = y - cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const index = (y * w + x) * 4;

                    if (dist <= radius) {
                        let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                        if (angle < 0) angle += 360;

                        const sat = (dist / radius) * 100;
                        const [r, g, b] = hslToRgb(angle, sat, 50);

                        data[index] = r;
                        data[index + 1] = g;
                        data[index + 2] = b;
                        data[index + 3] = 255;
                    } else {
                        data[index + 3] = 0;
                    }
                }
            }
            wheelCtx.putImageData(imgData, 0, 0);
        }

        function handleWheelPick(e) {
            const rect = wheelCanvas.getBoundingClientRect();
            const cx = rect.width / 2;
            const cy = rect.height / 2;
            const x = e.clientX - rect.left - cx;
            const y = e.clientY - rect.top - cy;

            let dist = Math.sqrt(x * x + y * y);
            const maxRadius = cx - 2;

            if (dist > maxRadius) dist = maxRadius;

            let angle = Math.atan2(y, x) * (180 / Math.PI);
            if (angle < 0) angle += 360;

            state.hue = Math.round(angle);
            state.sat = Math.round((dist / maxRadius) * 100);

            updateWheelCursorPosition(x, y, dist, maxRadius);
            updateColorFromHSL();
        }

        function updateWheelCursorPosition(x, y, dist, maxRadius) {
            const cx = wheelCanvas.width / 2;
            const cy = wheelCanvas.height / 2;

            let nx = x;
            let ny = y;
            if (dist > maxRadius) {
                const factor = maxRadius / dist;
                nx *= factor;
                ny *= factor;
            }

            wheelCursor.style.left = `${cx + nx}px`;
            wheelCursor.style.top = `${cy + ny}px`;
        }

        function updateColorFromHSL() {
            const hex = hslToHex(state.hue, state.sat, state.light);
            colorPreview.style.backgroundColor = hex;
            hexInput.value = hex.toUpperCase();

            const pureHex = hslToHex(state.hue, state.sat, 50);
            lightnessSlider.style.background = `linear-gradient(to right, #000000, ${pureHex}, #ffffff)`;

            if (state.colorTarget === 'fg' || state.colorTarget === 'both') state.fgColor = hex;
            if (state.colorTarget === 'bg' || state.colorTarget === 'both') state.bgColor = hex;
        }

        function setColorFromHex(hex) {
            const hsl = hexToHsl(hex);
            state.hue = hsl.h;
            state.sat = hsl.s;
            state.light = hsl.l;

            lightnessSlider.value = state.light;
            lightnessVal.textContent = state.light + '%';

            const maxRadius = (wheelCanvas.width / 2) - 2;
            const rad = (state.hue * Math.PI) / 180;
            const dist = (state.sat / 100) * maxRadius;
            const x = Math.cos(rad) * dist;
            const y = Math.sin(rad) * dist;

            updateWheelCursorPosition(x, y, dist, maxRadius);
            updateColorFromHSL();
        }

        function pushHistory() {
            undoStack.push(JSON.stringify(project));
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
            redoStack = [];
            updateUndoRedoUI();
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(JSON.stringify(project));
            let prevProject = undoStack.pop();
            project = JSON.parse(prevProject);
            
            if (state.currentFrame >= project.frames.length) {
                state.currentFrame = Math.max(0, project.frames.length - 1);
            }
            renderGrid();
            updateUI();
            updateUndoRedoUI();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(JSON.stringify(project));
            let nextProject = redoStack.pop();
            project = JSON.parse(nextProject);
            
            if (state.currentFrame >= project.frames.length) {
                state.currentFrame = Math.max(0, project.frames.length - 1);
            }
            renderGrid();
            updateUI();
            updateUndoRedoUI();
        }

        function clearHistory() {
            undoStack = [];
            redoStack = [];
            updateUndoRedoUI();
        }

        function updateUndoRedoUI() {
            btnUndo.disabled = undoStack.length === 0;
            btnRedo.disabled = redoStack.length === 0;
        }

        function buildGridDOM() {
            gridEl.innerHTML = '';
            gridEl.style.gridTemplateColumns = `repeat(${project.canvas.width}, ${state.cellWidth}px)`;
            gridEl.style.gridTemplateRows = `repeat(${project.canvas.height}, ${state.cellHeight}px)`;

            for (let y = 0; y < project.canvas.height; y++) {
                for (let x = 0; x < project.canvas.width; x++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.fontSize = `${state.cellHeight - 2}px`;
                    cell.dataset.x = x;
                    cell.dataset.y = y;

                    cell.addEventListener('mousedown', (e) => {
                        if (state.activeTool !== 'picker') {
                            pushHistory();
                        }
                        state.isMouseDown = true;
                        applyToolToCell(x, y);
                    });

                    cell.addEventListener('mouseenter', (e) => {
                        if (state.isMouseDown && (state.activeTool === 'paint' || state.activeTool === 'erase')) {
                            applyToolToCell(x, y);
                        }
                    });

                    gridEl.appendChild(cell);
                }
            }
        }

        function renderGrid() {
            if (gridEl.children.length !== project.canvas.width * project.canvas.height) {
                buildGridDOM();
            }

            gridEl.style.backgroundColor = project.canvas.backgroundColor;
            gridEl.classList.toggle('show-grid', state.showGrid);

            let matrix = project.frames[state.currentFrame];

            if (!matrix) return;

            let cells = gridEl.children;
            let index = 0;

            for (let y = 0; y < project.canvas.height; y++) {
                for (let x = 0; x < project.canvas.width; x++) {
                    let cellData = matrix[y][x];
                    let cellEl = cells[index++];

                    cellEl.textContent = cellData.char || ' ';
                    cellEl.style.color = cellData.fg || '#ffffff';
                    cellEl.style.backgroundColor = cellData.bg || 'transparent';
                }
            }
        }

        function applyToolToCell(x, y) {
            let matrix = project.frames[state.currentFrame];
            let cell = matrix[y][x];

            if (state.activeTool === 'erase') {
                if (state.colorTarget === 'fg' || state.colorTarget === 'both') cell.fg = null;
                if (state.colorTarget === 'bg' || state.colorTarget === 'both') cell.bg = null;
                let cellIndex = y * project.canvas.width + x;
                let cellEl = gridEl.children[cellIndex];
                cellEl.style.color = cell.fg || '#ffffff';
                cellEl.style.backgroundColor = cell.bg || 'transparent';
            } else if (state.activeTool === 'paint') {
                if (state.colorTarget === 'fg' || state.colorTarget === 'both') cell.fg = state.fgColor;
                if (state.colorTarget === 'bg' || state.colorTarget === 'both') cell.bg = state.bgColor;
                let cellIndex = y * project.canvas.width + x;
                let cellEl = gridEl.children[cellIndex];
                cellEl.style.color = cell.fg || '#ffffff';
                cellEl.style.backgroundColor = cell.bg || 'transparent';
            } else if (state.activeTool === 'picker') {
                let picked = null;
                if (state.colorTarget === 'fg') picked = cell.fg || '#FFFFFF';
                else if (state.colorTarget === 'bg') picked = cell.bg || project.canvas.backgroundColor;
                else picked = cell.fg || cell.bg || '#FFFFFF';

                if (picked) {
                    setColorFromHex(picked);
                }
            } else if (state.activeTool === 'recolor-char') {
                let targetChar = cell.char;
                for (let r = 0; r < project.canvas.height; r++) {
                    for (let c = 0; c < project.canvas.width; c++) {
                        if (matrix[r][c].char === targetChar) {
                            if (state.colorTarget === 'fg' || state.colorTarget === 'both') matrix[r][c].fg = state.fgColor;
                            if (state.colorTarget === 'bg' || state.colorTarget === 'both') matrix[r][c].bg = state.bgColor;
                        }
                    }
                }
                renderGrid();
            }
        }

        function parseSKA(buffer) {
            const bytes = new Uint8Array(buffer);
            const FRAME = 0x01, ROW_END = 0x02, PIXEL = 0x03, PIXEL_DATA = 0x04;

            let headerEnd = bytes.indexOf(FRAME);
            if (headerEnd === -1) throw new Error("Header im .ska Format nicht gefunden.");

            let headerStr = new TextDecoder().decode(bytes.subarray(0, headerEnd));
            let [wStr, hStr, bgStr, fpsStr] = headerStr.split(',');

            let width = parseInt(wStr) || 80;
            let height = parseInt(hStr) || 30;
            let backgroundColor = bgStr || "#000000";
            let fps = parseInt(fpsStr) || 15;

            let canvas = { width, height, backgroundColor, fps };
            let frames = [];

            let ptr = headerEnd;
            let prevMatrix = null;

            while (ptr < bytes.length) {
                if (bytes[ptr] === FRAME) {
                    ptr++;
                    let currentMatrix = [];
                    for (let y = 0; y < height; y++) {
                        let row = [];
                        for (let x = 0; x < width; x++) {
                            if (prevMatrix) {
                                row.push({ ...prevMatrix[y][x] });
                            } else {
                                row.push({ char: ' ', fg: null, bg: null });
                            }
                        }
                        currentMatrix.push(row);
                    }

                    let y = 0, x = 0;

                    while (ptr < bytes.length && bytes[ptr] !== FRAME) {
                        let b = bytes[ptr];

                        if (b === ROW_END) {
                            y++; x = 0; ptr++;
                        } else if (b === PIXEL) {
                            ptr++;
                            if (x >= width || y >= height) {
                                while (ptr < bytes.length && ![FRAME, ROW_END, PIXEL].includes(bytes[ptr])) ptr++;
                                x++;
                                continue;
                            }

                            let slotIndex = 0;

                            while (ptr < bytes.length && bytes[ptr] === PIXEL_DATA) {
                                ptr++;
                                let slotBytes = [];
                                while (ptr < bytes.length && ![FRAME, ROW_END, PIXEL, PIXEL_DATA].includes(bytes[ptr])) {
                                    slotBytes.push(bytes[ptr++]);
                                }

                                if (slotIndex === 0) {
                                    if (slotBytes.length > 0) {
                                        currentMatrix[y][x].char = new TextDecoder().decode(new Uint8Array(slotBytes));
                                    }
                                } else if (slotIndex === 1) {
                                    if (slotBytes.length > 0) {
                                        let str = String.fromCharCode(...slotBytes).trim();
                                        if (str === "NONE" || str === "RESET" || str === "") {
                                            currentMatrix[y][x].fg = null;
                                        } else {
                                            if (!str.startsWith('#')) str = '#' + str;
                                            currentMatrix[y][x].fg = str;
                                        }
                                    }
                                } else if (slotIndex === 2) {
                                    if (slotBytes.length > 0) {
                                        let str = String.fromCharCode(...slotBytes).trim();
                                        if (str === "NONE" || str === "RESET" || str === "") {
                                            currentMatrix[y][x].bg = null;
                                        } else {
                                            if (!str.startsWith('#')) str = '#' + str;
                                            currentMatrix[y][x].bg = str;
                                        }
                                    }
                                }
                                slotIndex++;
                            }
                            x++;
                        } else {
                            ptr++;
                        }
                    }

                    frames.push(currentMatrix);
                    prevMatrix = currentMatrix;
                } else {
                    ptr++;
                }
            }

            return { canvas, frames };
        }

        function exportSKA() {
            const FRAME = 0x01, ROW_END = 0x02, PIXEL = 0x03, PIXEL_DATA = 0x04;
            let bytes = [];

            let headerStr = `${project.canvas.width},${project.canvas.height},${project.canvas.backgroundColor},${project.canvas.fps}`;
            let headerBytes = new TextEncoder().encode(headerStr);
            for (let b of headerBytes) bytes.push(b);

            let prevMatrix = null;

            for (let f = 0; f < project.frames.length; f++) {
                bytes.push(FRAME);
                let currentMatrix = project.frames[f];

                for (let y = 0; y < project.canvas.height; y++) {
                    let rowPixels = [];

                    for (let x = 0; x < project.canvas.width; x++) {
                        let cell = currentMatrix[y][x];

                        let prevChar = prevMatrix ? prevMatrix[y][x].char : ' ';
                        let prevFg = prevMatrix ? prevMatrix[y][x].fg : null;
                        let prevBg = prevMatrix ? prevMatrix[y][x].bg : null;

                        let charChanged = (cell.char !== prevChar);
                        let fgChanged = (cell.fg !== prevFg);
                        let bgChanged = (cell.bg !== prevBg);

                        let pixel = [PIXEL];

                        if (charChanged || fgChanged || bgChanged) {
                            pixel.push(PIXEL_DATA);
                            if (charChanged && cell.char) {
                                let charBytes = new TextEncoder().encode(cell.char);
                                for (let b of charBytes) pixel.push(b);
                            }

                            if (fgChanged || bgChanged) {
                                pixel.push(PIXEL_DATA);
                                if (fgChanged) {
                                    let val = cell.fg ? cell.fg.replace('#', '') : 'NONE';
                                    for (let i = 0; i < val.length; i++) pixel.push(val.charCodeAt(i));
                                }
                            }

                            if (bgChanged) {
                                pixel.push(PIXEL_DATA);
                                let val = cell.bg ? cell.bg.replace('#', '') : 'NONE';
                                for (let i = 0; i < val.length; i++) pixel.push(val.charCodeAt(i));
                            }
                        }

                        rowPixels.push(pixel);
                    }

                    while (rowPixels.length > 0 && rowPixels[rowPixels.length - 1].length === 1 && rowPixels[rowPixels.length - 1][0] === PIXEL) {
                        rowPixels.pop();
                    }

                    for (let p of rowPixels) {
                        for (let b of p) bytes.push(b);
                    }
                    bytes.push(ROW_END);
                }
                prevMatrix = currentMatrix;
            }

            return new Uint8Array(bytes);
        }

        function parseJavE(text) {
            let lines = text.split(/\r?\n/);
            let width = 80;
            let height = 30;
            let bgColor = "#000000";
            let fps = 15;
            let frames = [];

            for (let line of lines) {
                if (line.startsWith("C:")) {
                    let colors = line.substring(2).trim().split(/\s+/);
                    if (colors.length >= 2 && colors[1].startsWith("#")) {
                        bgColor = colors[1];
                    }
                }
            }

            for (let line of lines) {
                if (line.startsWith("J:")) {
                    let content = line.substring(2);
                    if (content.startsWith("A")) {
                        content = content.substring(1);
                    }
                    let match = content.match(/^(\d+)\s+(\d+)\s*/);
                    if (match) {
                        width = parseInt(match[1]);
                        height = parseInt(match[2]);
                        let dataStr = content.substring(match[0].length);

                        let matrix = [];
                        for (let y = 0; y < height; y++) {
                            let row = [];
                            for (let x = 0; x < width; x++) {
                                row.push({ char: ' ', fg: null, bg: null });
                            }
                            matrix.push(row);
                        }

                        let currX = 0;
                        let currY = 0;
                        let i = 0;
                        while (i < dataStr.length && currY < height) {
                            if (dataStr[i] === '%') {
                                i++;
                                let numStr = "";
                                while (i < dataStr.length && dataStr[i] >= '0' && dataStr[i] <= '9') {
                                    numStr += dataStr[i];
                                    i++;
                                }
                                if (numStr.length > 0) {
                                    let count = parseInt(numStr);
                                    if (count === 0) {
                                        currY++;
                                        currX = 0;
                                    } else {
                                        if (i < dataStr.length) {
                                            let c = dataStr[i];
                                            i++;
                                            for (let k = 0; k < count; k++) {
                                                if (currX < width && currY < height) {
                                                    matrix[currY][currX].char = c;
                                                }
                                                currX++;
                                            }
                                        }
                                    }
                                } else {
                                    if (currX < width && currY < height) {
                                        matrix[currY][currX].char = '%';
                                    }
                                    currX++;
                                }
                            } else {
                                if (currX < width && currY < height) {
                                    matrix[currY][currX].char = dataStr[i];
                                }
                                currX++;
                                i++;
                            }
                        }
                        frames.push(matrix);
                    }
                }
            }

            return {
                canvas: { width, height, backgroundColor: bgColor, fps },
                frames: frames.length > 0 ? frames : null
            };
        }

        function parseHTMLAnimation(htmlText) {
            let rowsMatch = htmlText.match(/Rows\s*=\s*(\d+)/i);
            let colsMatch = htmlText.match(/Cols\s*=\s*(\d+)/i);
            let rows = rowsMatch ? parseInt(rowsMatch[1]) : 30;
            let cols = colsMatch ? parseInt(colsMatch[1]) : 80;

            let bgMatch = htmlText.match(/bgcolor=["']?(#[a-f0-9]{6}|[a-z]+)["']?/i);
            let bgColor = bgMatch ? bgMatch[1] : "#000000";
            if (!bgColor.startsWith('#')) bgColor = "#000000";

            let asciiStr = "";
            let asciiRegex = /var\s+Ascii\s*=\s*([\s\S]*?);/i;
            let match = asciiRegex.exec(htmlText);

            if (match) {
                let linesStr = match[1];
                let stringLiterals = linesStr.match(/"([^"\\]|\\.)*"/g) || [];
                asciiStr = stringLiterals.map(s => {
                    try { return JSON.parse(s); } catch (e) { return s.slice(1, -1); }
                }).join('');
            }

            let lines = asciiStr.split(/\r?\n/);
            if (lines.length > 0 && lines[lines.length - 1].trim() === "") lines.pop();

            let frames = [];
            let totalFrames = Math.floor(lines.length / rows);

            for (let f = 0; f < totalFrames; f++) {
                let matrix = [];
                for (let y = 0; y < rows; y++) {
                    let line = lines[f * rows + y] || "";
                    let row = [];
                    for (let x = 0; x < cols; x++) {
                        let char = x < line.length ? line[x] : ' ';
                        row.push({ char, fg: null, bg: null });
                    }
                    matrix.push(row);
                }
                frames.push(matrix);
            }

            return {
                canvas: { width: cols, height: rows, backgroundColor: bgColor, fps: 15 },
                frames: frames.length > 0 ? frames : null
            };
        }

        function setupShortcuts() {
            window.addEventListener('keydown', (e) => {
                const activeTag = document.activeElement ? document.activeElement.tagName : '';
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag)) return;

                const key = e.key.toLowerCase();

                if ((e.ctrlKey || e.metaKey) && key === 'z' && !e.shiftKey) {
                    e.preventDefault();
                    undo();
                    return;
                }

                if (((e.ctrlKey || e.metaKey) && key === 'y') || ((e.ctrlKey || e.metaKey) && e.shiftKey && key === 'z')) {
                    e.preventDefault();
                    redo();
                    return;
                }

                if ((e.ctrlKey || e.metaKey) && key === 's') {
                    e.preventDefault();
                    document.getElementById('btn-export').click();
                    return;
                }

                if (e.key === '#') {
                    e.preventDefault();
                    btnToggleGrid.click();
                    return;
                }

                switch (key) {
                    case ' ':
                        e.preventDefault();
                        togglePlay();
                        break;
                    case 'arrowleft':
                        e.preventDefault();
                        prevFrame();
                        break;
                    case 'arrowright':
                        e.preventDefault();
                        nextFrame();
                        break;
                    case 'b':
                    case 'p':
                        setTool('paint', document.getElementById('tool-paint'));
                        break;
                    case 'e':
                        setTool('erase', document.getElementById('tool-erase'));
                        break;
                    case 'i':
                        setTool('picker', document.getElementById('tool-picker'));
                        break;
                    case 'r':
                        setTool('recolor-char', document.getElementById('tool-recolor-char'));
                        break;
                    case 'f':
                        setTarget('fg', document.getElementById('target-fg'));
                        break;
                    case 'g':
                        setTarget('bg', document.getElementById('target-bg'));
                        break;
                    case 't':
                        setTarget('both', document.getElementById('target-both'));
                        break;
                }
            });
        }

        function setupEventListeners() {
            window.addEventListener('mouseup', () => state.isMouseDown = false);

            btnUndo.onclick = undo;
            btnRedo.onclick = redo;

            btnToggleGrid.onclick = () => {
                state.showGrid = !state.showGrid;
                btnToggleGrid.classList.toggle('active', state.showGrid);
                gridEl.classList.toggle('show-grid', state.showGrid);
            };

            spriteNameInput.oninput = (e) => {
                project.name = e.target.value.trim() || "Sprite_01";
            };

            fileInput.onchange = (e) => {
                let file = e.target.files[0];
                if (!file) return;

                let baseName = file.name.substring(0, file.name.lastIndexOf('.')) || "Sprite_01";
                spriteNameInput.value = baseName;

                let reader = new FileReader();
                if (file.name.endsWith('.ska')) {
                    reader.onload = (event) => {
                        try {
                            let parsed = parseSKA(event.target.result);
                            project = parsed;
                            project.name = baseName;
                            state.currentFrame = 0;
                            clearHistory();
                            buildGridDOM();
                            renderGrid();
                            updateUI();
                        } catch (err) {
                            alert("Fehler beim Laden der .ska Datei: " + err.message);
                        }
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.onload = (event) => {
                        try {
                            let text = event.target.result;
                            let parsed = null;

                            let isJavE = file.name.endsWith('.jmov') || file.name.endsWith('.jave') || text.includes('*:JavE') || text.includes('J:A') || text.startsWith('J:');

                            if (isJavE) {
                                parsed = parseJavE(text);
                            } else if (file.name.endsWith('.html') || file.name.endsWith('.htm') || text.includes('<html')) {
                                parsed = parseHTMLAnimation(text);
                            } else {
                                parsed = parseJavE(text);
                            }

                            if (parsed && parsed.frames) {
                                project = parsed;
                                project.name = baseName;
                                state.currentFrame = 0;
                                clearHistory();
                                buildGridDOM();
                                renderGrid();
                                updateUI();
                            } else {
                                alert("Keine gültige Animation in der Datei gefunden.");
                            }
                        } catch (err) {
                            alert("Fehler beim Parsen der Datei: " + err.message);
                        }
                    };
                    reader.readAsText(file);
                }
            };

            document.getElementById('btn-export').onclick = () => {
                let bytes = exportSKA();
                let blob = new Blob([bytes], { type: 'application/octet-stream' });
                let a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                
                let safeName = (project.name || 'Sprite_01').trim().replace(/[^a-z0-9_ -]/gi, '_');
                a.download = `${safeName}.ska`;
                a.click();
            };

            btnPlay.onclick = togglePlay;
            btnNext.onclick = nextFrame;
            btnPrev.onclick = prevFrame;

            frameSlider.oninput = (e) => {
                state.currentFrame = parseInt(e.target.value);
                renderGrid();
                updateUI();
            };

            fpsInput.onchange = (e) => {
                project.canvas.fps = parseInt(e.target.value) || 15;
                if (state.isPlaying) {
                    stopPlay();
                    startPlay();
                }
            };

            document.getElementById('tool-paint').onclick = function() { setTool('paint', this); };
            document.getElementById('tool-erase').onclick = function() { setTool('erase', this); };
            document.getElementById('tool-picker').onclick = function() { setTool('picker', this); };
            document.getElementById('tool-recolor-char').onclick = function() { setTool('recolor-char', this); };

            document.getElementById('target-fg').onclick = function() { setTarget('fg', this); };
            document.getElementById('target-bg').onclick = function() { setTarget('bg', this); };
            document.getElementById('target-both').onclick = function() { setTarget('both', this); };

            canvasBgPicker.onchange = (e) => {
                pushHistory();
                project.canvas.backgroundColor = e.target.value;
                renderGrid();
            };

            document.getElementById('btn-edit-palette').onclick = () => {
                state.isEditingPalette = !state.isEditingPalette;
                const btn = document.getElementById('btn-edit-palette');
                if (state.isEditingPalette) {
                    btn.textContent = '✓ Fertig';
                    btn.style.backgroundColor = '#ef4444';
                    btn.style.borderColor = '#ef4444';
                } else {
                    btn.textContent = '✏️ Palette bearbeiten';
                    btn.style.backgroundColor = '';
                    btn.style.borderColor = '';
                }
                renderHistorySwatches();
            };

            document.getElementById('btn-fill-fg-chars').onclick = () => {
                pushHistory();
                let matrix = project.frames[state.currentFrame];
                for (let r of matrix) {
                    for (let c of r) {
                        if (c.char && c.char !== ' ') {
                            c.fg = state.fgColor;
                        }
                    }
                }
                renderGrid();
            };

            document.getElementById('btn-fill-fg-chars-all').onclick = () => {
                pushHistory();
                for (let f = 0; f < project.frames.length; f++) {
                    let matrix = project.frames[f];
                    for (let r of matrix) {
                        for (let c of r) {
                            if (c.char && c.char !== ' ') {
                                c.fg = state.fgColor;
                            }
                        }
                    }
                }
                renderGrid();
            };

            document.getElementById('btn-fill-bg').onclick = () => {
                pushHistory();
                let matrix = project.frames[state.currentFrame];
                for (let r of matrix) for (let c of r) c.bg = state.bgColor;
                renderGrid();
            };

            document.getElementById('btn-fill-fg').onclick = () => {
                pushHistory();
                let matrix = project.frames[state.currentFrame];
                for (let r of matrix) for (let c of r) c.fg = state.fgColor;
                renderGrid();
            };

            document.getElementById('btn-clear-colors').onclick = () => {
                pushHistory();
                let matrix = project.frames[state.currentFrame];
                for (let r of matrix) for (let c of r) { c.fg = null; c.bg = null; }
                renderGrid();
            };
        }

        function setTool(tool, btn) {
            state.activeTool = tool;
            document.querySelectorAll('.sidebar .tool-grid button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setTarget(target, btn) {
            state.colorTarget = target;
            document.querySelectorAll('.sidebar .tool-group:nth-child(3) button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            let targetColor = (target === 'bg') ? state.bgColor : state.fgColor;
            setColorFromHex(targetColor);
        }

        function togglePlay() {
            if (state.isPlaying) stopPlay(); else startPlay();
        }

        function startPlay() {
            state.isPlaying = true;
            btnPlay.innerHTML = `⏸️ Pause <span class="shortcut-hint">Space</span>`;
            let interval = 1000 / project.canvas.fps;
            state.playInterval = setInterval(() => nextFrame(), interval);
        }

        function stopPlay() {
            state.isPlaying = false;
            btnPlay.innerHTML = `▶ Play <span class="shortcut-hint">Space</span>`;
            clearInterval(state.playInterval);
        }

        function nextFrame() {
            state.currentFrame = (state.currentFrame + 1) % project.frames.length;
            renderGrid();
            updateUI();
        }

        function prevFrame() {
            state.currentFrame = (state.currentFrame - 1 + project.frames.length) % project.frames.length;
            renderGrid();
            updateUI();
        }

        function updateUI() {
            spriteNameInput.value = project.name || "Sprite_01";
            frameSlider.max = Math.max(0, project.frames.length - 1);
            frameSlider.value = state.currentFrame;
            frameCounter.textContent = `Frame: ${state.currentFrame + 1} / ${project.frames.length}`;
            fpsInput.value = project.canvas.fps;
            canvasW.value = project.canvas.width;
            canvasH.value = project.canvas.height;
            canvasBgPicker.value = project.canvas.backgroundColor;
            btnToggleGrid.classList.toggle('active', state.showGrid);
        }

        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
        }

        function hslToHex(h, s, l) {
            const [r, g, b] = hslToRgb(h, s, l);
            return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        function hexToHsl(hex) {
            let r = parseInt(hex.slice(1, 3), 16) / 255;
            let g = parseInt(hex.slice(3, 5), 16) / 255;
            let b = parseInt(hex.slice(5, 7), 16) / 255;

            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        window.onload = init;
    </script>
</body>
